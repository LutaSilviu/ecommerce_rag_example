<section class="register-card" aria-labelledby="login-heading">
  <h2 id="login-heading">Bine ai revenit</h2>
  <p class="register-intro">Autentifică-te pentru a continua cumpărăturile și a-ți vedea comenzile.</p>

  <div id="login-error" class="register-error" role="alert" aria-live="assertive" aria-atomic="true" hidden></div>

  <form id="login-form" class="register-form" action="/api/v1/auth/login" method="post" data-auth-form="login">
    <div class="form-field">
      <label for="login-email">Adresă de e-mail <span>(obligatoriu)</span></label>
      <input id="login-email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="login-email-hint">
      <p id="login-email-hint" class="form-hint">Introdu adresa de e-mail asociată contului tău.</p>
    </div>

    <div class="form-field">
      <label for="login-password">Parolă <span>(obligatoriu)</span></label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required aria-describedby="login-password-hint">
      <p id="login-password-hint" class="form-hint">Introdu parola contului tău.</p>
    </div>

    <button class="button button--primary" type="submit">Autentifică-te</button>
  </form>

  <div class="auth-divider" aria-hidden="true"><span>sau</span></div>
  <p id="google-auth-status" class="form-hint" data-google-status role="status" aria-live="polite" hidden></p>
  <button class="button button--secondary" type="button" data-google-signin>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 48 48" focusable="false">
      <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.5 9.5 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15Z"/>
      <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.8 1.2-4.1 2-6.8 2-5.2 0-9.6-3.5-11.2-8.2H5.9v5.2A20 20 0 0 0 24 44Z"/>
      <path fill="#FBBC05" d="M12.8 27.8a12 12 0 0 1 0-7.6V15H5.9a20 20 0 0 0 0 18Z"/>
      <path fill="#EA4335" d="M24 12c3 0 5.6 1 7.7 3l5.8-5.8A19.5 19.5 0 0 0 24 4 20 20 0 0 0 5.9 15l6.9 5.2C14.4 15.5 18.8 12 24 12Z"/>
    </svg>
    Continuă cu Google
  </button>

  <p class="register-login">Nu ai încă un cont? <a href="/register">Creează-ți contul</a></p>
</section>
