services:
  web:
    build: .
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: sqlite:////app/data/nexo-market.db
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the shell before starting Compose}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-nexo_session}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-604800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-with-google-oauth-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-replace-with-google-oauth-client-secret}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-${APP_BASE_URL:-http://localhost:8000}/api/v1/auth/google/callback}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      - nexo-data:/app/data
    restart: unless-stopped

volumes:
  nexo-data:
