[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo-market"
version = "0.1.0"
description = "Romanian single-store ecommerce prototype"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2,<3",
    "alembic>=1.14,<2",
    "pwdlib[argon2]>=0.2,<1",
    "authlib>=1.4,<2",
    "httpx>=0.27,<1",
    "itsdangerous>=2.2,<3",
    "openai>=1.68,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**/*", "static/*"]
